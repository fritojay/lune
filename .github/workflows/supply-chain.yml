name: Supply chain

# Runs on every change, and daily so advisories published against an
# unchanged Cargo.lock still fail a run.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (tag in the comment), as
# in ci.yml.

env:
  CARGO_TERM_COLOR: always
  CARGO_VET_VERSION: "0.10.3"

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-vet
        run: cargo install --locked cargo-vet --version "$CARGO_VET_VERSION"
      - name: cargo vet
        run: cargo vet --locked
