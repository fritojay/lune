name: Release

# Builds the macOS .dmg and the Fedora Flatpak. A `v*` tag also gets a draft
# GitHub release with both attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (tag in the comment), as
# in ci.yml.

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.11.2"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag must name the version the packages are built with.
      - id: check
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$(packaging/check-version.py "$GITHUB_REF_NAME")"
          else
            version="$(packaging/check-version.py)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS app
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          aqtversion: "==3.3.0"
          cache: true
      - name: Point CXX-Qt at the pinned Qt
        run: echo "QMAKE=$QT_ROOT_DIR/bin/qmake" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0 # keep in sync with rust-toolchain.toml
      - name: Build the app and the disk image
        run: packaging/macos/build-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  flatpak:
    name: Flatpak
    needs: version
    runs-on: ubuntu-latest
    container:
      # Pinned by digest like the actions (tag: kde-6.11).
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
      # The runner's preinstalled toolchains, mounted so the job can delete
      # them: the SDK and Rust extension don't fit in the runner's free space.
      volumes:
        - /usr/local/lib/android:/host/android
        - /usr/share/dotnet:/host/dotnet
        - /opt/ghc:/host/ghc
        - /opt/hostedtoolcache:/host/toolcache
    steps:
      - name: Free disk space
        run: |
          df -h /
          rm -rf /host/android/* /host/dotnet/* /host/ghc/* /host/toolcache/*
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/linux/io.github.fritojay.Lune.yml
          bundle: Lune-${{ needs.version.outputs.version }}.flatpak
          artifact-name: flatpak
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'packaging/linux/*.yml') }}

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Lune $GITHUB_REF_NAME" dist/*
