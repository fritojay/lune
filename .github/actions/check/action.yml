name: Check
description: >
  fmt, clippy, tests, and a build of the whole workspace: the steps every
  platform runs. Qt must already be installed and QMAKE set.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rust
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - name: fmt
      shell: bash
      run: cargo fmt --all --check
    - name: clippy
      shell: bash
      run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
    - name: test
      shell: bash
      run: cargo test --locked --workspace --all-features
    - name: build
      shell: bash
      run: cargo build --locked --workspace --all-targets
