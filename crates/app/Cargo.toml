[package]
name = "lune-app"
description = "Desktop UI: CXX-Qt bridge and QML. The only crate allowed to depend on Qt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lune"
path = "src/main.rs"

[dependencies]
lune-core.workspace = true
lune-engine.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
# Media keys and Now Playing; the default libdbus backend on Linux.
souvlaki = "0.9.3"

# The hidden window Windows' media controls attach to, and the bench's memory reading.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cxx-qt-build.workspace = true
# The Windows exe's icon (packaging/windows/lune.rc); a no-op elsewhere.
embed-resource = "3.0.12"

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
