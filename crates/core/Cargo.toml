[package]
name = "lune-core"
description = "Library scanning, read-only tag reading, SQLite storage, grouping, search, and the queue model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
caseless = "0.2.2"
directories = "6.0.0"
# Cover thumbnails only; JPEG and PNG are what embedded art uses in practice.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25.5"
notify = "8.2.2"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror.workspace = true
toml = "1.2.1"
tracing.workspace = true
unicode-normalization = "0.1.26"

[features]
# Generates fake library rows for UI benchmarks (`Library::generate_synthetic`).
synthetic = []

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
